<!-- components/toast-container.html -->
<!-- Conteneur global pour les notifications Toast. 
     À inclure une seule fois par page via : 
     <div data-component="components/toast-container.html"></div> -->

<div id="vala-toast-container" 
     class="fixed top-4 right-4 z-[100] flex flex-col gap-3 w-full max-w-sm pointer-events-none"
     role="region" 
     aria-live="polite" 
     aria-label="Notifications">
    <!-- Les toasts seront injectés ici par ValaToast.show() -->
</div>
